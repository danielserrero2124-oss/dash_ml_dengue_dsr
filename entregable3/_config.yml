# Configuración del Jupyter Book del Tercer Entregable (140 modelos con validación anidada)
title: "Tercer Entregable – Modelos, optimización y comparación estadística"  # Título del libro
author: "Daniel Serrano Romero"  # Autor
copyright: "2026"  # Año
logo: "images/logoUN.png"  # Logo de la universidad
favicon: "images/logoUN.png"  # Icono de la pestaña

only_build_toc_files: true  # Solo se procesan los archivos listados en _toc.yml
exclude_patterns: ["_build", "construir", "e3", "resultados", "*.log", "*.py"]  # Carpetas que no forman parte del libro

execute:
  execute_notebooks: "off"  # Los cuadernos se ejecutan antes con nbconvert y se publican con sus salidas

parse:
  myst_enable_extensions:  # Extensiones de MyST
    - dollarmath  # Fórmulas con $...$ y $$...$$
    - colon_fence  # Bloques ::: de notas

html:
  home_page_in_navbar: true  # La portada aparece en la barra lateral

sphinx:
  config:
    language: es  # Idioma
    html_show_copyright: true  # Copyright
    suppress_warnings: ["mystnb.unknown_mime_type"]  # Oculta avisos por tipos de salida no reconocidos
    templates_path: ["_templates"]  # Tarjeta del autor
    html_static_path: ["_static"]  # Foto y estilos
    html_css_files: ["autor.css"]  # Estilos de la tarjeta
    html_sidebars:  # Barra lateral en todas las páginas
      "**": ["navbar-logo.html", "autor.html", "search-button-field.html", "sbt-sidebar-nav.html"]  # Logo, foto, buscador e índice
